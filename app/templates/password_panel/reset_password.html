{% load static tailwind_tags %}
{% tailwind_css %}

<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="relative text-gray-700 min-h-screen flex items-center justify-center px-4 sm:px-6 py-6 sm:py-8 overflow-hidden">

    <div class="absolute inset-0 bg-cover bg-center"
         style="background-image: url('{% static 'bg_image/login-bg.jpg' %}');">
    </div>

    <div class="absolute inset-0 bg-black/60 backdrop-blur-md"></div>

    {% include "error_message/error_message.html" %}

    <div class="relative z-10 w-full max-w-md mx-auto">

        <div class="bg-white/95 backdrop-blur-xl 
                    rounded-3xl shadow-2xl 
                    p-6 sm:p-8">

            <h2 class="text-xl sm:text-2xl font-bold text-center mb-6">
                Set New Password
            </h2>

            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-medium mb-2">
                        New Password
                    </label>
                    <input type="password"
                           name="password"
                           required
                           class="w-full px-4 py-3 border rounded-xl 
                                  focus:ring-2 focus:ring-blue-500 outline-none text-base"/>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">
                        Confirm Password
                    </label>
                    <input type="password"
                           name="confirm_password"
                           required
                           class="w-full px-4 py-3 border rounded-xl 
                                  focus:ring-2 focus:ring-blue-500 outline-none text-base"/>
                </div>

                <button type="submit"
                        class="w-full bg-blue-600 text-white py-3 
                               rounded-xl font-semibold 
                               hover:bg-blue-700 transition text-base">
                    Reset Password
                </button>

            </form>

        </div>
    </div>

</body>
</html>
