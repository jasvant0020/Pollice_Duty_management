{% load static tailwind_tags %}
{% tailwind_css %}

<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>
</head>

<body class="relative text-gray-700 min-h-screen flex items-center justify-center px-4 py-8 overflow-hidden">

    <div class="absolute inset-0 bg-cover bg-center"
         style="background-image: url('{% static 'bg_image/login-bg.jpg' %}');">
    </div>

    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>

    {% include "error_message/error_message.html" %}

    <div class="relative z-10 w-full max-w-md">

        <div class="bg-white/95 backdrop-blur-xl 
                    rounded-3xl shadow-2xl 
                    p-8">

            <h2 class="text-2xl font-bold text-center mb-4">
                Verify OTP
            </h2>

            <!-- ✅ Countdown Timer -->
            <div class="text-center mb-6">
                <p class="text-sm text-gray-600">OTP expires in</p>
                <p id="countdown"
                   class="text-xl font-bold text-red-600">
                   05:00
                </p>
            </div>

            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-medium mb-2">
                        Enter 6-digit OTP
                    </label>
                    <input type="text"
                           name="otp"
                           maxlength="6"
                           required
                           class="w-full px-4 py-3 text-center tracking-widest 
                                  border rounded-xl 
                                  focus:ring-2 focus:ring-blue-500 outline-none"/>
                </div>

                <button type="submit"
                        class="w-full bg-blue-600 text-white py-3 
                               rounded-xl font-semibold 
                               hover:bg-blue-700 transition">
                    Verify OTP
                </button>

            </form>

        </div>
    </div>

<script>
    const expiryTime = "{{ expiry_time }}";

    if (expiryTime) {
        const expiry = new Date(expiryTime).getTime();

        const timer = setInterval(function () {
            const now = new Date().getTime();
            const distance = expiry - now;

            if (distance <= 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "Expired";
                window.location.href = "{% url 'forgot_password' %}";
                return;
            }

            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("countdown").innerHTML =
                String(minutes).padStart(2, '0') + ":" +
                String(seconds).padStart(2, '0');

        }, 1000);
    }
</script>

</body>
</html>
