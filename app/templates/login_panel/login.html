{% load static tailwind_tags %}
{% tailwind_css %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>

<body x-data="{ showPassword: false, loading: false }"
      class="relative min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8 py-8 overflow-hidden">

    <!-- Background Image -->
    <div class="absolute inset-0 bg-cover bg-center"
         style="background-image: url('{% static 'bg_image/login-bg.jpg' %}');">
    </div>

    <!-- Dark Overlay -->
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>

    {% include "error_message/error_message.html" %}

    <!-- Floating Police Badge -->
    <div class="absolute 
                top-6 right-6 
                sm:top-6 sm:right-6 
                md:top-10 md:right-10 
                animate-bounce">

        <div class="w-10 h-10 
                    sm:w-12 sm:h-12 
                    md:w-16 md:h-16 
                    bg-yellow-400 
                    rounded-xl md:rounded-2xl 
                    flex items-center justify-center 
                    shadow-xl md:shadow-2xl">

            <span class="text-lg 
                        sm:text-2xl 
                        md:text-3xl">
                🛡️
            </span>

        </div>
    </div>

    <!-- Login Card -->
    <div class="relative z-10 w-full max-w-sm sm:max-w-md md:max-w-lg">

        <!-- Animated Gradient Border -->
        <div class="p-0.5 rounded-3xl ">

            <div class="bg-white/95 backdrop-blur-xl 
                        rounded-3xl shadow-2xl 
                        p-6 sm:p-8 md:p-10 
                        transform transition-all duration-700 
                        hover:scale-[1.01]">

                <!-- Header -->
                <div class="text-center mb-6 sm:mb-8">
                    <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-gray-800 mb-2">
                        Welcome
                    </h1>
                    <p class="text-sm sm:text-base text-gray-600">
                        Sign in to your account
                    </p>
                </div>

                <!-- Form -->
                <form class="space-y-5 sm:space-y-6"
                      method="POST"
                      @submit="loading = true">

                    {% csrf_token %}

                    <!-- Email -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Email Address
                        </label>
                        <input
                            type="email"
                            name="email"
                            required
                            placeholder="you@example.com"
                            class="w-full px-4 py-3 text-gray-800 
                                   border border-gray-300 rounded-xl 
                                   focus:ring-2 focus:ring-blue-500 
                                   focus:border-transparent outline-none 
                                   transition shadow-sm focus:shadow-md"
                        />
                    </div>

                    <!-- Password -->
                    <div class="relative">
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Password
                        </label>

                        <input
                            :type="showPassword ? 'text' : 'password'"
                            name="password"
                            required
                            placeholder="Enter your password"
                            class="w-full px-4 py-3 pr-12 text-gray-800 
                                   border border-gray-300 rounded-xl 
                                   focus:ring-2 focus:ring-blue-500 
                                   focus:border-transparent outline-none 
                                   transition shadow-sm focus:shadow-md"
                        />

                        <!-- Toggle Button -->
                        <button type="button"
                                @click="showPassword = !showPassword"
                                class="absolute right-3 top-[42px] text-gray-500 hover:text-gray-700">
                            👁
                        </button>
                    </div>

                    <!-- Remember / Forgot -->
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 text-sm text-gray-600">
                        <label class="flex items-center">
                            <input type="checkbox"
                                   class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"/>
                            <span class="ml-2">Remember me</span>
                        </label>

                        <a href="#"
                           class="text-blue-600 hover:text-blue-700 font-medium">
                            Forgot password?
                        </a>
                    </div>

                    <!-- Button -->
                    <button type="submit"
                            class="relative w-full bg-blue-600 text-white py-3 
                                   rounded-xl font-semibold 
                                   hover:bg-blue-700 transition duration-300 
                                   shadow-lg hover:shadow-xl 
                                   flex items-center justify-center gap-2">

                        <span x-show="!loading">Sign In</span>

                        <!-- Loading Spinner -->
                        <svg x-show="loading"
                             class="animate-spin h-5 w-5 text-white"
                             xmlns="http://www.w3.org/2000/svg"
                             fill="none"
                             viewBox="0 0 24 24">
                            <circle class="opacity-25"
                                    cx="12"
                                    cy="12"
                                    r="10"
                                    stroke="currentColor"
                                    stroke-width="4"></circle>
                            <path class="opacity-75"
                                  fill="currentColor"
                                  d="M4 12a8 8 0 018-8v8z"></path>
                        </svg>

                    </button>
                </form>

            </div>
        </div>
    </div>

</body>
</html>
