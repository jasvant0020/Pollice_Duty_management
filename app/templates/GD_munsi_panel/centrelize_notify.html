{% extends 'GD_munsi_panel/base.html' %}
{% block page_title %}Centrelize Notify{% endblock %}

{% block content %}
{% include "error_message/error_message.html" %}

<div class="max-w-3xl mx-auto mt-8 bg-white shadow-lg rounded-lg p-8">
<h2 class="text-2xl font-bold text-gray-800 mb-6">
    📢 Send Centralized Notification
</h2>

<form method="POST" class="space-y-6">
    {% csrf_token %}

    <!-- Notification Type -->
    <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
            Notification Type
        </label>

        <select 
            name="notify_type"
            class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
            <option value="normal">Normal</option>
            <option value="sos">SOS (Critical)</option>
        </select>
    </div>


    <!-- Send To -->
    <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
            Send To
        </label>

        <select name="scope" id="scope"
        class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500">

        {% if request.user.role == "master_admin" %}

        <option value="developer">Developer</option>
        <option value="all_super_admin">All Super Admin</option>
        <option value="specific_super_admin">Specific Super Admin</option>

        {% elif request.user.role == "super_admin" %}

        <option value="master_admin">Master Admin</option>
        <option value="all_admin">All Admin</option>
        <option value="specific_admin">Specific Admin</option>

        {% elif request.user.role == "admin" %}

        <option value="super_admin">Super Admin</option>
        <option value="gd_munsi">GD Munsi</option>
        <option value="specific_staff">Specific Staff</option>
        <option value="specific_vvip">Specific VVIP</option>
        <option value="staff">All Staff</option>
        <option value="all_vvip">All VVIP</option>

        {% elif request.user.role == "gd_munsi" %}

        <option value="admin">Admin</option>
        <option value="specific_vvip">Specific VVIP</option>
        <option value="all_vvip">All VVIP</option>
        <option value="staff">All Staff</option>
        <option value="specific_staff">Specific Staff</option>

        {% endif %}

        </select>
    </div>


    <!-- Select Specific User -->
    <div id="user_select" style="display:none;">
        <label class="block text-sm font-semibold text-gray-700 mb-2">
            Select Person
        </label>

        <select 
            name="target_user"
            id="target_user"
            class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
            <option value="">Select User</option>

            {% for u in users %}
            <option value="{{ u.id }}">
                {{ u.username }} ({{ u.role }})
            </option>
            {% endfor %}

        </select>
    </div>


    <!-- Receiver Preview -->
    <div id="receiver_preview" class="bg-gray-50 border border-gray-200 rounded-md p-4 hidden">

        <p class="text-sm font-semibold text-gray-700 mb-3">
            👥 Notification will be sent to:
        </p>

        <ul id="receiver_list" class="text-sm text-gray-800 space-y-1 max-h-40 overflow-y-auto">
        </ul>

    </div>


    <!-- Title -->
    <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
            Notification Title
        </label>

        <input
            type="text"
            name="title"
            required
            class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter notification title"
        >
    </div>


    <!-- Message -->
    <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
            Notification Message
        </label>

        <textarea
            name="message"
            rows="4"
            required
            class="w-full border border-gray-300 rounded-md px-3 py-2 text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Write your message here..."
        ></textarea>
    </div>


    <!-- Submit Button -->
    <div class="pt-2">
        <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-md transition duration-200"
        >
            Send Notification
        </button>
    </div>

</form>
```

</div>

<!-- Pass Django users to JS -->

<script>

const allUsers = [
{% for u in users %}
{
    id: "{{u.id}}",
    username: "{{u.username}}",
    role: "{{u.role}}"
},
{% endfor %}
];

const scopeSelect = document.getElementById("scope");
const userSelectBox = document.getElementById("user_select");
const previewBox = document.getElementById("receiver_preview");
const receiverList = document.getElementById("receiver_list");
const targetUser = document.getElementById("target_user");


// 🔹 Filter dropdown based on scope
function filterDropdown(){

    const scope = scopeSelect.value;
    targetUser.innerHTML = '<option value="">Select User</option>';

    let filteredUsers = [];

    if(scope === "specific_staff"){
        filteredUsers = allUsers.filter(u => u.role === "field_staff");
    }

    else if(scope === "specific_vvip"){
        filteredUsers = allUsers.filter(u => u.role === "vvip");
    }

    else if(scope === "specific_admin"){
        filteredUsers = allUsers.filter(u => u.role === "admin");
    }

    else if(scope === "specific_super_admin"){
        filteredUsers = allUsers.filter(u => u.role === "super_admin");
    }

    filteredUsers.forEach(user => {
        const option = document.createElement("option");
        option.value = user.id;
        option.textContent = user.username + " (" + user.role + ")";
        targetUser.appendChild(option);
    });
}


// 🔹 Preview
function updatePreview(){

    receiverList.innerHTML = "";
    previewBox.classList.add("hidden");

    const scope = scopeSelect.value;

    if(scope.includes("specific")){

        const selectedId = targetUser.value;

        if(selectedId){
            const user = allUsers.find(u => u.id === selectedId);

            if(user){
                previewBox.classList.remove("hidden");

                const li = document.createElement("li");
                li.textContent = user.username + " (" + user.role + ")";
                receiverList.appendChild(li);
            }
        }
    }

    else if(scope === "staff"){
        const staffUsers = allUsers.filter(u => u.role === "field_staff");

        if(staffUsers.length){
            previewBox.classList.remove("hidden");

            staffUsers.forEach(user => {
                const li = document.createElement("li");
                li.textContent = user.username + " (Staff)";
                receiverList.appendChild(li);
            });
        }
    }

    else if(scope === "all_vvip"){
        const vvipUsers = allUsers.filter(u => u.role === "vvip");

        if(vvipUsers.length){
            previewBox.classList.remove("hidden");

            vvipUsers.forEach(user => {
                const li = document.createElement("li");
                li.textContent = user.username + " (VVIP)";
                receiverList.appendChild(li);
            });
        }
    }

    else if(scope === "admin"){
        const adminUsers = allUsers.filter(u =>
            ["admin","super_admin","master_admin"].includes(u.role)
        );

        if(adminUsers.length){
            previewBox.classList.remove("hidden");

            adminUsers.forEach(user => {
                const li = document.createElement("li");
                li.textContent = user.username + " (" + user.role + ")";
                receiverList.appendChild(li);
            });
        }
    }
}


// 🔹 Handle scope change
scopeSelect.addEventListener("change", function(){

    targetUser.value = "";
    receiverList.innerHTML = "";
    previewBox.classList.add("hidden");

    if(this.value.includes("specific")){
        userSelectBox.style.display = "block";
        filterDropdown();   // ✅ show only relevant users
    }
    else{
        userSelectBox.style.display = "none";
    }

    updatePreview();
});


// 🔹 On selecting user
targetUser.addEventListener("change", updatePreview);

</script>

{% endblock %}
