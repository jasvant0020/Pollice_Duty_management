{% extends "user_panel/user_base.html" %}
{% block page_title %}Send Request{% endblock %}
{% block content %}
{% include "error_message/error_message.html" %}
<div class="max-w-4xl mx-auto px-4 py-8">

    <!-- Header -->
    <div class="mb-6 flex items-center justify-between">
        
        <div>
            <h2 class="text-3xl font-bold text-gray-900">Send Request</h2>
            <p class="text-gray-600">Fill out the form below to send your request.</p>
        </div>

        <!-- History Icon -->
        <a href="{% url 'request_history' %}" 
            class="p-2 rounded-lg bg-gray-200 hover:bg-teal-100 text-gray-700 hover:text-teal-700 transition"
            title="Request History">

                <svg xmlns="http://www.w3.org/2000/svg" 
                    class="w-5 h-5" 
                    fill="none" 
                    viewBox="0 0 24 24" 
                    stroke="currentColor">
                    <circle cx="12" cy="12" r="9" stroke-width="2"/>
                    <path d="M12 7v5l3 2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>

        </a>

    </div>

    <!-- Request Form -->
    <form method="POST" class="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 space-y-6">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
                Subject
            </label>
            <input type="text" name="subject" placeholder="Enter subject"
                   class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-gray-700 focus:border-teal-500 focus:ring-4 focus:ring-teal-100 outline-none transition-all duration-200">
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
                Message
            </label>
            <textarea name="message" rows="5" placeholder="Enter your request"
                      class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-gray-700 focus:border-teal-500 focus:ring-4 focus:ring-teal-100 outline-none transition-all duration-200"></textarea>
        </div>

        <div class="flex justify-end">
            <button type="submit"
                    class="bg-linear-to-r from-teal-600 to-cyan-600 text-white px-6 py-3 rounded-xl shadow-lg hover:shadow-xl hover:from-teal-700 hover:to-cyan-700 transition-all duration-300 font-semibold">
                Send Request
            </button>
        </div>

    </form>
</div>

{% endblock %}
