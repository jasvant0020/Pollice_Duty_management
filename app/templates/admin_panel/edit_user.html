{% extends 'admin_panel/admin_base.html' %}
{% block page_title %}Edit User{% endblock %}
{% block content %}
{% include "error_message/error_message.html" %}
<h1 class="text-2xl font-bold text-gray-800 mb-6">
    Edit User - {{ officer.first_name }}
</h1>

<form method="POST" class="bg-white max-w-2xl p-6 shadow border-t-4 rounded-2xl space-y-4 border-indigo-600">
    {% csrf_token %}

    <!-- Name Field -->
    <div>
        <label for="name" class="block text-gray-700 font-semibold mb-1">Name:</label>
        <input type="text" name="name" id="name" 
               value="{{ officer.first_name }}"
               class="w-full text-gray-800 border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" 
               required>
    </div>

    <!-- Email Field -->
    <div>
        <label for="email" class="block text-gray-700 font-semibold mb-1">Email:</label>
        <input type="email" name="email" id="email"
               value="{{ officer.email }}"
               class="w-full text-gray-800 border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" 
               required>
    </div>

    <!-- Phone -->
    <div>
        <label class="block text-gray-700 font-semibold mb-1">Phone:</label>
        <input name="phone" id="phone" value="{{ officer.phone }}" 
        type="tel"
        placeholder="Enter 10 digit mobile number"
        pattern="[6-9][0-9]{9}"
        maxlength="10"
        minlength="10"
        title="Enter valid 10 digit Indian mobile number"
        class="w-full text-gray-800 border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
    </div>

    

    <!-- Gender Field -->
    <div>
        <label for="gender" class="block text-gray-700 font-semibold mb-1">Gender:</label>
        <select name="gender" id="gender"
                class="w-full text-gray-800 border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="Male" {% if officer.gender == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if officer.gender == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if officer.gender == 'Other' %}selected{% endif %}>Other</option>
        </select>
    </div>

    <!-- DOB Field -->
    <div>
        <label for="dob" class="block text-gray-700 font-semibold mb-1">Date of Birth (DOB):</label>

        <div class="relative">
            <input type="date" name="dob" id="dob"
                value="{{ officer.dob|date:'Y-m-d' }}"
                class="w-full text-gray-800 border border-gray-300 rounded-md p-2 pr-10 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                required>

            <!-- Calendar Icon -->
            <div class="absolute inset-y-0 right-3 flex items-center cursor-pointer"
                onclick="document.getElementById('dob').showPicker()">

                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5 text-gray-500 hover:text-gray-700"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">

                    <path stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M8 7V3m8 4V3m-9 8h10m-13 9h16a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v11a2 2 0 002 2z"/>
                </svg>

            </div>
        </div>
    </div>

    <!-- Rank Field -->
    <div>
        <label for="rank" class="block text-gray-700 font-semibold mb-1">Rank:</label>
        <select name="rank" id="rank"
                class="w-full text-gray-800 border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            {% for r in police_rank %}
            <option value="{{ r.police_rank }}" {% if officer.rank == r.police_rank %}selected{% endif %}>
                {{ r.police_rank }}
            </option>
            {% endfor %}
        </select>
    </div>

    <!-- Role Field -->
    <div>
        <label for="role" class="block text-gray-700 font-semibold mb-1">Role:</label>
        <select name="role" id="role"
                class="w-full text-gray-800 border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            {% for r in role %}
            <option value="{{ r }}" {% if officer.role == r %}selected{% endif %}>
                {{ r|title }}
            </option>
            {% endfor %}
        </select>
    </div>


    <button type="submit" 
            class="mt-4 px-4 py-2 bg-blue-600 text-white rounded shadow hover:bg-blue-700">
        Update
    </button>
</form>

{% endblock %}
