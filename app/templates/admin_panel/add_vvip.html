{% extends 'admin_panel/admin_base.html' %}
{% block page_title %}Add VVIP{% endblock %}
{% block content %}
{% include "error_message/error_message.html" %}
<div class="pt-10">
<div class="bg-white max-w-2xl text-gray-800 p-6 shadow border-t-4 rounded-2xl space-y-4 border-indigo-600">

    <h2 class="text-2xl font-semibold text-gray-700 mb-5">Add New VVIP</h2>

    <form method="POST">
        {% csrf_token %}

        <!-- Name -->
        <label class="block font-medium">Name</label>
        <input type="text" name="name" required class="w-full p-2 border rounded-lg mb-4" placeholder="Enter full name">

        <!-- Email -->
        <label class="block font-medium">Email</label>
        <input type="email" name="email" required class="w-full p-2 border rounded-lg mb-4" placeholder="Enter email">

        <!-- Password -->
        <label class="block font-medium">Password</label>
        <input type="password" name="password" required class="w-full p-2 border rounded-lg mb-4" placeholder="Enter password">

        <!-- Gender -->
        <label class="block font-medium">Gender</label>
        <select name="gender" class="w-full p-2 border rounded-lg mb-4" required>
            <option value="">-- Select Gender --</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <!-- DOB -->
        <div>
            <label class="block text-gray-700 font-semibold mb-1">Date of Birth:</label>

            <div class="relative">
                <input id="dob" type="date" name="dob"
                    class="w-full text-gray-800 border rounded p-2 pr-10 bg-white"
                    required>

                <!-- Calendar Icon -->
                <div class="absolute inset-y-0 right-3 flex items-center cursor-pointer"
                    onclick="document.getElementById('dob').showPicker()">

                    <svg xmlns="http://www.w3.org/2000/svg"
                        class="h-5 w-5 text-gray-500 hover:text-gray-700"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor">

                        <path stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M8 7V3m8 4V3m-9 8h10m-13 9h16a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v11a2 2 0 002 2z"/>
                    </svg>

                </div>
            </div>
        </div>

        <!-- Designation -->
        <label class="block font-medium">Rank</label>
        <select id="rank-select" name="rank"
                class="w-full p-2 border rounded-lg mb-4" required>

            <option value="">-- Select --</option>
            <option value="PM">PM</option>

            {% for r in ranks %}
                <option value="{{ r }}">{{ r }}</option>
            {% endfor %}

            <option value="other">Other</option>
        </select>

        <!-- Custom designation input -->
        <input type="text" id="custom-rank"
            name="custom_rank"
            placeholder="Enter custom rank"
            class="w-full p-2 border rounded-lg mb-4"
            style="display:none;">
        
        <!-- category -->
        <label class="block font-medium">Category</label>
        <select id="category" name="category" class="w-full p-2 border rounded-lg mb-4" required>
            <option value="">-- Select --</option>
            {% for c in category %}
                <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
        </select>


        <!-- Submit -->
        <button type="submit"
                class="w-full py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
            Add VVIP
        </button>

    </form>

</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const select = document.getElementById('rank-select');
    const customInput = document.getElementById('custom-rank');

    select.addEventListener('change', function () {
        if (this.value === 'other') {
            customInput.style.display = 'block';
        } else {
            customInput.style.display = 'none';
            customInput.value = '';
        }
    });
});
</script>
{% endblock %}
