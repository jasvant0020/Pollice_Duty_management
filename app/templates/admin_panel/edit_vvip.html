{% extends 'admin_panel/admin_base.html' %}
{% block page_title %}Edit VVIP Profile{% endblock %}
{% block content %}
{% include "error_message/error_message.html" %}
<div class="pt-10">
<div class="bg-white max-w-2xl text-gray-800 p-6 shadow border-t-4 rounded-2xl space-y-4 border-indigo-600">

    <h2 class="text-2xl font-semibold text-gray-700 mb-5">
        Edit VVIP Profile
    </h2>

    <form method="POST">
        {% csrf_token %}
        <!-- Name -->
        <label class="block font-medium">Name</label>
        <input type="text" name="name" required
               value="{{ vvip.first_name }}"
               class="w-full text-gray-800 border border-gray-300 rounded-md p-2 pr-10 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4">

        <!-- Email -->
        <label class="block font-medium">Email</label>
        <input type="email" name="email" required
               value="{{ vvip.email }}"
               class="w-full text-gray-800 border border-gray-300 rounded-md p-2 pr-10 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4">

        
        <!-- Gender -->
        <label class="block font-medium">Gender</label>
        <select name="gender" class="w-full text-gray-800 border border-gray-300 rounded-md p-2 pr-10 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4" required>
            <option value="">-- Select Gender --</option>
            <option value="male" {% if vvip.gender == "male" %}selected{% endif %}>Male</option>
            <option value="female" {% if vvip.gender == "female" %}selected{% endif %}>Female</option>
            <option value="other" {% if vvip.gender == "other" %}selected{% endif %}>Other</option>
        </select>

        <!-- DOB Field -->
        <div>
            <label for="dob" class="block text-gray-700 font-semibold mb-1">Date of Birth (DOB):</label>

            <div class="relative">
                <input type="date" name="dob" id="dob"
                    value="{{ vvip.dob|date:'Y-m-d' }}"
                    class="w-full text-gray-800 border border-gray-300 rounded-md p-2 pr-10 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4"
                    required>

                <!-- Calendar Icon -->
                <div class="absolute inset-y-0 right-3 flex items-center cursor-pointer"
                    onclick="document.getElementById('dob').showPicker()">

                    <svg xmlns="http://www.w3.org/2000/svg"
                        class="h-5 w-5 text-gray-500 hover:text-gray-700"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor">

                        <path stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M8 7V3m8 4V3m-9 8h10m-13 9h16a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v11a2 2 0 002 2z"/>
                    </svg>

                </div>
            </div>
        </div>

        <!-- Rank / Designation -->
        <label class="block font-medium">Rank</label>
        <select id="rank-select" name="rank"
                class="w-full text-gray-800 border border-gray-300 rounded-md p-2 pr-10 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4" required>
            <option value="">-- Select --</option>

            <!-- PM option -->
            <option value="PM" {% if vvip.rank == "PM" %}selected{% endif %}>PM</option>

            <!-- Predefined ranks from backend -->
            {% for r in ranks %}
                <option value="{{ r }}" {% if vvip.rank == r %}selected{% endif %}>{{ r }}</option>
            {% endfor %}

            <!-- Custom rank -->
            <option value="other" {% if is_custom_rank %}selected{% endif %}>Other</option>
        </select>

        <!-- Custom rank input -->
        <input type="text" id="custom-rank"
            name="custom_rank"
            value="{% if is_custom_rank %}{{ vvip.rank }}{% endif %}"
            placeholder="Enter custom rank"
            class="w-full text-gray-800 border border-gray-300 rounded-md p-2 pr-10 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4"
            {% if not is_custom_rank %}style="display:none;"{% endif %}>

        <!-- Category -->
        <label class="block font-medium">Category</label>
        <select name="category" class="w-full text-gray-800 border border-gray-300 rounded-md p-2 pr-10 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4" required>
            <option value="">-- Select --</option>
            {% for c in category %}
                <option value="{{ c.id }}"
                    {% if vvip.category and vvip.category.id == c.id %}
                        selected
                    {% endif %}
                >
                    {{ c.name }}
                </option>
            {% endfor %}
        </select>

        <!-- Submit -->
        <button type="submit"
                class="w-full py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
            Update VVIP
        </button>

    </form>

</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const select = document.getElementById('rank-select');
    const customInput = document.getElementById('custom-rank');

    function toggleCustomRank() {
        if (select.value === 'other') {
            customInput.style.display = 'block';
        } else {
            customInput.style.display = 'none';
            customInput.value = '';
        }
    }

    toggleCustomRank(); // 🔥 Ensure prefilled value shows on edit
    select.addEventListener('change', toggleCustomRank);
});
</script>

{% endblock %}
