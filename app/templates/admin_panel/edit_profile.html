{% extends "admin_panel/admin_base.html" %}
{% block page_title %}Edit Profile{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">

    <form method="POST" enctype="multipart/form-data"
          class="bg-white rounded-2xl shadow p-6 space-y-6">
        {% csrf_token %}

        <h2 class="text-xl font-semibold text-gray-700">
            Edit Profile
        </h2>

        <!-- NAME -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-gray-700">
            <div>
                <label class="text-sm">First Name</label>
                <input type="text" name="first_name"
                       value="{{ user.first_name }}"
                       class="w-full mt-1 border rounded-lg px-4 py-2">
            </div>

            <div>
                <label class="text-sm">Last Name</label>
                <input type="text" name="last_name"
                       value="{{ user.last_name }}"
                       class="w-full mt-1 border rounded-lg px-4 py-2">
            </div>
        </div>

        <!-- EMAIL (EDITABLE) -->
        <div>
            <label class="text-sm text-gray-700">Email</label>
            <input type="email" name="email"
                   value="{{ user.email }}"
                   class="w-full mt-1 border rounded-lg px-4 py-2 text-gray-700">
        </div>

        <!-- PHONE -->
        <div>
            <label class="text-sm text-gray-700">Phone</label>
            <input type="text" name="phone"
                   value="{{ user.phone }}"
                   class="w-full mt-1 border rounded-lg px-4 py-2 text-gray-700">
        </div>

        <!-- PROFILE PHOTO -->
        <div>
            <label class="text-sm text-gray-700">Profile Photo</label>

            <div class="flex items-center gap-4 mt-2">
                <img id="preview"
                    src="{% if user.profile_photo %}{{ user.profile_photo.url }}{% endif %}"
                    class="w-16 h-16 rounded-full object-cover border">

                <label class="cursor-pointer bg-teal-50 text-teal-700 px-4 py-2 rounded-lg border border-teal-200 hover:bg-teal-100 transition">
                    Change Photo
                    <input type="file"
                        name="profile_photo"
                        class="hidden"
                        accept="image/*"
                        onchange="previewImage(this)">
                </label>
            </div>
        </div>

        <!-- PASSWORD CHANGE -->
        <div class="border-t border-gray-200 pt-6">
            <h3 class="text-lg font-semibold text-gray-700 mb-3">
                Change Password
            </h3>

            <div class="text-gray-700 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="text-sm ">New Password</label>
                    <input type="password" name="password"
                           class="w-full mt-1 border rounded-lg px-4 py-2">
                </div>

                <div>
                    <label class="text-sm ">Confirm Password</label>
                    <input type="password" name="confirm_password"
                           class="w-full mt-1 border rounded-lg px-4 py-2">
                </div>
            </div>

            <p class="text-sm text-gray-500 mt-2">
                Leave blank if you don’t want to change password.
            </p>
        </div>

        <!-- ACTIONS -->
        <div class="flex justify-end gap-4 pt-4">
            <a href="{% url 'profile' %}"
               class="px-5 py-2 border rounded-lg text-gray-600 hover:bg-gray-100">
                Cancel
            </a>
            <button type="submit"
                    class="bg-teal-600 text-white px-6 py-2 rounded-lg hover:bg-teal-700">
                Save Changes
            </button>
        </div>

    </form>
</div>
<script>
function previewImage(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
            document.getElementById("preview").src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
{% endblock %}
